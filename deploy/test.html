<!DOCTYPE html>
<html>
<head>
    <title>Marginalia Test</title>
</head>
<body>
    <h1>Testing Connection to http://127.0.0.1:3000</h1>
    <script>
        fetch('http://127.0.0.1:3000')
            .then(response => response.text())
            .then(html => {
                console.log('✅ Connection successful');
                document.body.innerHTML += '<h2>✅ Server responds correctly</h2>' + html;
            })
            .catch(error => {
                console.error('❌ Connection failed:', error);
                document.body.innerHTML += '<h2>❌ Connection failed: ' + error + '</h2>';
            });
    </script>
</body>
</html>
